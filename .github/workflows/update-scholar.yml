name: Update Google Scholar data

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (05:17 in Jazan)
    - cron: "47 13 * * *"  # second daily run at 13:47 UTC (16:47 in Jazan) in case GitHub skips one
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar profile via SerpAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_scholar.py

      - name: Commit updated data
        run: |
          git config user.name "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"
          git add scholar.json
          git commit -m "Update Google Scholar data $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
